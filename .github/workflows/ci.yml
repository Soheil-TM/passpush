name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: go test ./...
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
      - run: node --test web/crypto.test.mjs
